name: Profession scan (on-demand, single keyword)

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Keyword to scan (e.g. plumber)"
        required: true
      city:
        description: "City to scan (must match the city originally searched)"
        required: true

jobs:
  profession-scan:
    runs-on: ubuntu-latest
    # Internal 25-min budget in scan_reviews.py's scan_many() is what
    # actually caps how long this runs (and always saves partial results
    # if it's hit) - this is just an outer safety net, not the real limit.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install our sync/notify dependencies
        run: pip install -r scraper-worker/requirements.txt

      - name: Clone the review-scraping engine
        run: |
          git clone --depth 1 https://github.com/georgekhananaev/google-reviews-scraper-pro.git engine
          pip install -r engine/requirements.txt

      - name: Run profession scan
        working-directory: scraper-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
          SCRAPER_ENGINE_DIR: ${{ github.workspace }}/engine
        run: python profession_scan.py --keyword "${{ github.event.inputs.keyword }}" --city "${{ github.event.inputs.city }}"
