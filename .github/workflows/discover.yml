name: Discover businesses (keyword + city search)

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "e.g. plumber"
        required: true
      city:
        description: "e.g. Manchester"
        required: true

jobs:
  discover:
    runs-on: ubuntu-latest   # comes with Docker pre-installed
    timeout-minutes: 55   # bumped from 30 - email extraction (-email flag) takes noticeably longer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper-worker/requirements.txt

      - name: Pull the discovery engine image
        run: docker pull gosom/google-maps-scraper

      - name: Run discovery
        working-directory: scraper-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
        run: python discover.py --keyword "${{ github.event.inputs.keyword }}" --city "${{ github.event.inputs.city }}"
