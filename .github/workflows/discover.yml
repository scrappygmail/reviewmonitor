name: Discover businesses (keyword + city search)

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "e.g. plumber"
        required: true
      city:
        description: "e.g. Manchester"
        required: true

jobs:
  discover:
    runs-on: ubuntu-latest   # comes with Docker pre-installed
    # Bumped way up (was 55) - this run now finds businesses AND scans all
    # of their reviews for negatives in one shot, instead of requiring a
    # separate manual "Scan all reviews" step afterwards.
    # Discovery itself (gosom, especially with -email on a large result
    # set) is internally capped at 50 min (see discover.py's subprocess
    # timeout). The review-scan phase now always gets its own dedicated
    # 25-min budget on top of that, regardless of how long discovery took
    # (see the job_start_time comment in discover.py's main() for why).
    # This ceiling covers the realistic worst case of both back to back
    # plus setup overhead - it's a safety net, not the expected runtime.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper-worker/requirements.txt

      - name: Pull the discovery engine image
        run: docker pull gosom/google-maps-scraper

      - name: Clone the review-scraping engine
        run: |
          git clone --depth 1 https://github.com/georgekhananaev/google-reviews-scraper-pro.git engine
          pip install -r engine/requirements.txt

      - name: Run discovery + review scan
        working-directory: scraper-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
          SCRAPER_ENGINE_DIR: ${{ github.workspace }}/engine
        run: python discover.py --keyword "${{ github.event.inputs.keyword }}" --city "${{ github.event.inputs.city }}"
