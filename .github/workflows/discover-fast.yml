name: Discover businesses - Fast (numbers only, no email)

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "e.g. plumber"
        required: true
      city:
        description: "e.g. Manchester"
        required: true

jobs:
  discover:
    runs-on: ubuntu-latest   # comes with Docker pre-installed
    # Exact clone of discover.yml's timeout - discovery itself is much
    # faster here (no email extraction), but the review-scan phase after
    # it still gets its own full budget same as the regular search, so
    # the same safety margin applies.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper-worker/requirements.txt

      - name: Pull the discovery engine image
        run: docker pull gosom/google-maps-scraper

      - name: Clone the review-scraping engine
        run: |
          git clone --depth 1 https://github.com/georgekhananaev/google-reviews-scraper-pro.git engine
          pip install -r engine/requirements.txt

      - name: Run discovery (fast, no email) + review scan
        working-directory: scraper-worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
          SCRAPER_ENGINE_DIR: ${{ github.workspace }}/engine
        run: python discover.py --keyword "${{ github.event.inputs.keyword }}" --city "${{ github.event.inputs.city }}" --fast
